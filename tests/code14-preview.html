<!doctype html>
<meta charset="utf-8">
<title>RDP Code 14 visualizer check</title>
<pre id="result">Running…</pre>
<iframe src="../index.html" style="width:1900px;height:1100px;border:0"></iframe>
<script>
  (async () => {
    const frame = document.querySelector('iframe');
    const result = document.querySelector('#result');
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    try {
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const csv = await (await fetch('../examples/rdp-code-14-ldhat.csv')).text();
      const transfer = new DataTransfer();
      transfer.items.add(new File([csv], 'rdp-code-14-ldhat.csv', { type: 'text/csv' }));
      const input = frame.contentDocument.querySelector('#file-input');
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
      for (let i = 0; i < 50; i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 100));
        const plot = frame.contentDocument.querySelector('#rdp-plot');
        if (plot.data?.length) {
          const curves = plot.data.filter((trace) => trace.meta?.comparisonIndex === 0);
          const ticks = plot.data.find((trace) => trace.name === 'Sampled alignment positions');
          assert(curves.length === 3, 'Mean curve or 95% bounds missing');
          assert(curves.at(-1).y[0] === 3.4038, 'Rho values changed');
          assert(plot.layout.yaxis2.range[0] === 0 && plot.layout.yaxis2.range[1] > 12.4678, 'Rho axis must increase upward');
          assert(ticks.x.length === 1690 * 3 && ticks.opacity === 0.25, 'Faint sample ticks missing');
          assert(plot.layout.xaxis3.matches === 'x', 'Sample ticks must share zoom');
          assert(curves[1].fill === 'tonexty', '95% confidence band missing');
          assert(plot.layout.yaxis.visible === false, 'Absent ORFs should not display frame tracks');
          assert(frame.contentDocument.querySelector('#method-badge').textContent === 'LDhat recombination rate', 'Method badge missing');
          result.textContent = 'PASS: Code 14 mean rho, 95% band, 1690 faint aligned samples, absent ORFs';
          break;
        }
      }
      if (!result.textContent.startsWith('PASS')) {
        result.textContent = `FAIL: ${frame.contentDocument.querySelector('#status').textContent}`;
      }
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`;
    }
  })();
</script>
