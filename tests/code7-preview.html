<!doctype html>
<meta charset="utf-8">
<title>RDP Code 7 visualizer check</title>
<pre id="result">Running…</pre>
<iframe src="../index.html" style="width:1900px;height:1100px;border:0"></iframe>
<script>
  (async () => {
    const frame = document.querySelector('iframe');
    const result = document.querySelector('#result');
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    try {
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const csv = await (await fetch('../examples/rdp-code-7-chimaera.csv')).text();
      const transfer = new DataTransfer();
      transfer.items.add(new File([csv], 'rdp-code-7-chimaera.csv', { type: 'text/csv' }));
      const input = frame.contentDocument.querySelector('#file-input');
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
      for (let i = 0; i < 50; i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 100));
        const plot = frame.contentDocument.querySelector('#rdp-plot');
        if (plot.data?.length) {
          const curves = plot.data.filter((trace) => trace.meta?.comparisonIndex !== undefined && trace.mode === 'lines');
          const siteTicks = plot.data.filter((trace) => trace.meta?.comparisonIndex !== undefined && trace.mode === 'markers');
          const shapes = plot.layout.shapes;
          assert(curves.length === 3, 'Expected three CHIMAERA curves');
          assert(siteTicks.length === 3, 'Expected three informative-site tick groups');
          assert(curves.map((trace) => trace.line.color).join('|') === '#75b77b|#7f8aca|#d88989', 'Trace colors differ from the reference');
          assert(curves.map((trace) => trace.x.length).join('|') === '239|157|317', 'Per-sequence positions were lost');
          assert(curves[0].x[3] === 50 && curves[1].x[3] === 418 && curves[2].x[3] === 46, 'Curves incorrectly share one x-axis array');
          assert(Math.abs(curves[2].y[0] - 19.63469) < 1e-6, 'CHIMAERA values were rescaled');
          assert(shapes.some((shape) => shape.y0 === 2.99573227355399 && shape.y1 === shape.y0), 'Lower cutoff missing');
          assert(shapes.some((shape) => shape.y0 === 4.66275783168157 && shape.y1 === shape.y0), 'Upper cutoff missing');
          assert(shapes.some((shape) => shape.x0 === 3498 && shape.x1 === 9310 && shape.y0 === 0), 'Recombinant interval missing');
          assert(plot.layout.yaxis2.range[1] > 20.3 && plot.layout.yaxis2.range[1] < 20.4, 'CHIMAERA axis range differs from the reference');
          assert(frame.contentDocument.querySelector('#method-badge').textContent === 'CHIMAERA plot', 'Method badge missing');
          result.textContent = `PASS: ${curves.length} CHIMAERA curves, informative-site ticks, both cutoffs, breakpoint interval`;
          break;
        }
      }
      if (!result.textContent.startsWith('PASS')) {
        result.textContent = `FAIL: ${frame.contentDocument.querySelector('#status').textContent}`;
      }
    } catch (error) {
      result.textContent = `FAIL: ${error.message}`;
    }
  })();
</script>
